name: Shorebird - criar o app (rodar uma vez)

# Este workflow so roda quando voce clica em "Run workflow".
# Ele cria o app la no Shorebird e mostra o app_id no final do log.
on:
  workflow_dispatch:

jobs:
  criar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar o projeto pela pasta app_src
        run: |
          APPSRC=$(find . -type d -name app_src -not -path './.git/*' | head -1)
          SRC=$(dirname "$APPSRC")
          echo "Projeto encontrado em: $SRC"
          if [ "$SRC" != "." ]; then
            cp -r "$SRC"/. .
          fi

      - name: Criar a estrutura Android
        run: flutter create . --org com.mindi --project-name garcom --platforms=android

      - name: Colocar o codigo das telas no lugar certo
        run: |
          mkdir -p lib
          cp app_src/*.dart lib/
          rm -rf test

      - name: Baixar dependencias
        run: flutter pub get

      - name: Instalar o Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Criar o app no Shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird init --display-name "Mindi Garcom" --force

      - name: MOSTRAR O APP_ID
        run: |
          echo "=================================================="
          echo "   COPIE A LINHA app_id ABAIXO E ME ENVIE"
          echo "=================================================="
          cat shorebird.yaml
          echo "=================================================="
          echo "Trecho do pubspec.yaml (assets):"
          grep -n -A 6 "  assets:" pubspec.yaml || true
          echo "=================================================="
